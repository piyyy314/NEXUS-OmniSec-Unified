name: Shadow313 NEXUS CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "core/**"
      - "deploy/**"
      - ".github/workflows/shadow313-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "core/**"
      - "deploy/**"
      - ".github/workflows/shadow313-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Compile Python package
        run: python -m compileall -q core/shadow313

      - name: Run API runtime regression tests
        env:
          PYTHONPATH: core
        run: python -m pytest core/tests/test_api_runtime.py -q

      - name: Parse Compose YAML
        run: python -c "import yaml; yaml.safe_load(open('deploy/docker-compose.yml', encoding='utf-8'))"

      - name: Validate resolved Compose configuration
        env:
          SHADOW313_API_KEY: ci-validation-key
          WEBUI_SECRET_KEY: ci-validation-webui-secret
          SHADOW313_DATA_DIR: /tmp/shadow313-ci-data
        run: docker compose -f deploy/docker-compose.yml config --quiet

  container:
    name: Build NEXUS container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NEXUS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: nexus
          push: false
          load: true
          tags: shadow313-nexus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Python package and API factory
        run: docker run --rm --entrypoint python shadow313-nexus:ci -c "import shadow313; from shadow313.api.server import create_app; create_app(api_key='ci-validation-key'); print(shadow313.__version__)"

      - name: Smoke-test CLI entry point
        run: docker run --rm shadow313-nexus:ci -m shadow313.cli.main --help
